<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Film Stage</title>
<style>
  :root { --bg: #17161c; --panel: #222129; --text: #e9e4da; --muted: #9a95a6; --accent: #f2b544; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 ui-monospace, SFMono-Regular, monospace; }
  body.render { background: #000; }
  canvas { display: block; margin: 0 auto; width: min(100vw, calc(100vh - 92px)); height: auto; }
  body.render canvas { width: auto; margin: 0; }
  #ui { padding: 10px 16px; display: grid; gap: 8px; max-width: 1080px; margin: 0 auto; }
  body.render #ui { display: none; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  input[type=range] { flex: 1; min-width: 200px; accent-color: var(--accent); }
  button { background: var(--panel); color: var(--text); border: 1px solid #3a3842; border-radius: 6px; padding: 4px 10px; font: inherit; cursor: pointer; }
  .muted { color: var(--muted); }
  #scenes { display: flex; gap: 2px; height: 10px; }
  #scenes span { background: #3a3842; cursor: pointer; }
  #scenes span.on { background: var(--accent); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="scenes"></div>
  <div class="row">
    <button id="play">play</button>
    <input id="scrub" type="range" min="0" value="0">
    <span id="info"></span>
  </div>
  <div class="muted">space play · ←/→ frame · shift+←/→ scene · ?film=slug&amp;t=seconds</div>
</div>
<script type="module">
  import * as rt from '../src/films/runtime.js';
  import { makePaper } from '../src/lib/draw/paper.js';

  const q = new URLSearchParams(location.search);
  const slug = q.get('film') || 'test';
  if (q.has('render')) document.body.classList.add('render');
  const { default: film } = await import(`../src/films/${slug}/film.js`);
  const c = document.getElementById('c');
  c.width = c.height = film.size;
  const ctx = c.getContext('2d');
  const paper = makePaper(film.size, film.seed, film.paper);
  const frames = rt.frameCount(film);
  const tl = rt.timeline(film);
  let frame = 0;

  function draw(i) {
    frame = Math.max(0, Math.min(frames - 1, i));
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, film.size, film.size);
    return rt.renderFrame(ctx, film, frame, { paper, look: q.get('look') ?? undefined, loop: q.has('loop') });
  }

  // The renderer drives this: draw frame i and hand back a PNG.
  window.__stage = {
    info: { slug, fps: film.fps, size: film.size, frames, duration: rt.duration(film), vtt: rt.chaptersVTT(film), scenes: tl.map((s) => ({ id: s.id, start: s.start, dur: s.dur })) },
    render(i) { draw(i); return c.toDataURL('image/png'); },
  };

  if (!q.has('render')) {
    const scrub = document.getElementById('scrub'), info = document.getElementById('info');
    const playBtn = document.getElementById('play'), bar = document.getElementById('scenes');
    scrub.max = frames - 1;
    tl.forEach((s) => {
      const el = document.createElement('span');
      el.style.flex = s.dur;
      el.title = `${s.index + 1}. ${s.id} (${s.dur}s)`;
      el.onclick = () => show(Math.round(s.start * film.fps));
      bar.append(el);
    });
    function show(i) {
      const s = draw(i);
      scrub.value = frame;
      [...bar.children].forEach((el, k) => el.classList.toggle('on', k === s.index));
      info.textContent = `f ${frame}/${frames - 1} · ${(frame / film.fps).toFixed(2)}s · ${s.index + 1}/${tl.length} ${s.id}`;
      q.set('t', (frame / film.fps).toFixed(2));
      history.replaceState(null, '', `?${q}`);
    }
    let playing = false, t0 = 0, f0 = 0;
    function tick(now) {
      if (!playing) return;
      const i = f0 + Math.floor(((now - t0) / 1000) * film.fps);
      if (i >= frames) { playing = false; playBtn.textContent = 'play'; return; }
      if (i !== frame) show(i);
      requestAnimationFrame(tick); // preview only; renders never use rAF
    }
    function toggle() {
      playing = !playing;
      playBtn.textContent = playing ? 'pause' : 'play';
      if (playing) { if (frame >= frames - 1) frame = 0; t0 = performance.now(); f0 = frame; requestAnimationFrame(tick); }
    }
    playBtn.onclick = toggle;
    scrub.oninput = () => show(+scrub.value);
    addEventListener('keydown', (e) => {
      if (e.key === ' ') { e.preventDefault(); toggle(); }
      const s = rt.locate(film, frame).scene;
      if (e.key === 'ArrowRight') show(e.shiftKey ? Math.round((tl[s.index + 1]?.start ?? s.start) * film.fps) : frame + 1);
      if (e.key === 'ArrowLeft') show(e.shiftKey ? Math.round((tl[Math.max(0, s.index - 1)].start) * film.fps) : frame - 1);
    });
    show(Math.round((+q.get('t') || 0) * film.fps));
  }
</script>
</body>
</html>
